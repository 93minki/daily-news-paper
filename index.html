
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>데일리 뉴스 리포트</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f3f3;
      color: #111;
      font-family: Arial, sans-serif;
    }
    .page {
      width: 1280px;
      margin: 40px auto;
      background: #fff;
      padding: 40px;
    }
    .title {
      font-size: 42px;
      font-weight: 700;
      margin-bottom: 12px;
      border-bottom: 4px solid #111;
      padding-bottom: 16px;
    }
    .date {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }
    .video-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .video-summary {
      font-size: 17px;
      line-height: 1.9;
      margin-bottom: 28px;
      color: #222;
    }
    .video-link {
      display: inline-block;
      margin-bottom: 32px;
      font-size: 14px;
      color: #0b57d0;
      text-decoration: none;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
    }
    .section-title {
      font-size: 30px;
      font-weight: 700;
      border-bottom: 2px solid #ddd;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }
    .item {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eee;
    }
    .item-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.5;
    }
    .item-meta {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }
    .item-summary {
      font-size: 16px;
      line-height: 1.9;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="title">데일리 뉴스 리포트</div>
    <div class="date">2026. 5. 26. AM 1:26:05</div>
    <div class="video-title">[출근길픽] 이란 전쟁 끝 보이나 싶더니…중동 일제히 &#39;당황&#39; / YTN</div>
    <div class="video-summary">JSON 파싱 실패</div>
    <a class="video-link" href="https://www.youtube.com/watch?v=lucMi4Qrz6M" target="_blank" rel="noopener noreferrer">영상 바로가기</a>

    <div class="grid">
      
    </div>
  </div>
</body>
</html>
